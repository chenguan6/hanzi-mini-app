services:
  - type: web
    name: hanzi-mini-app-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://main.hidden-frost-3cf1.pages.dev
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: STORE_FILE
        value: /var/data/store.json
    disk:
      name: hanzi-mini-app-data
      mountPath: /var/data
      sizeGB: 1
